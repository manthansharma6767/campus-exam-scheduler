name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: campus_exam_scheduler
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/campus_exam_scheduler?serverTimezone=UTC
      TEST_DATASOURCE_USERNAME: root
      TEST_DATASOURCE_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-wrapper-${{ runner.os }}-

      - name: Apply Flyway migrations
        env:
          MYSQL_PWD: password
        run: |
          set -euo pipefail
          for migration in backend/src/main/resources/db/migration/V*__*.sql; do
            echo "Applying ${migration}"
            mysql --host=127.0.0.1 --user=root campus_exam_scheduler < "${migration}"
          done

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
